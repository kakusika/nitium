[package]
name = "nitium-shell"
description = "Slint UI shell and application controller for Nitium (Servo-free)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
links = "nitium_shell"
build = "build.rs"

[dependencies]
nitium-core = { workspace = true }
nitium-settings = { workspace = true }
origiri = { workspace = true }
origiri-theme = { workspace = true }
slint = { workspace = true }
log = { workspace = true }

[build-dependencies]
origiri-build = { workspace = true }
slint-build = { workspace = true, features = ["experimental-module-builds"] }
