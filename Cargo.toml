[workspace]
resolver = "3"
members = [
  "apps/desktop",
  "crates/nitium-core",
  "crates/nitium-settings",
  "crates/nitium-shell",
  "crates/nitium-webview",
]
default-members = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
nitium-core = { path = "crates/nitium-core" }
nitium-settings = { path = "crates/nitium-settings" }
nitium-shell = { path = "crates/nitium-shell" }
nitium-webview = { path = "crates/nitium-webview" }

#= Origiri Frameworks
origiri = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-build = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-config = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-icons = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-panes = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-theme = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-viewport = { git = "https://github.com/kakusika/origiri-frameworks.git" }

#= Servo & Webview
servo = "0.7.0"
servo-allocator = { version = "0.7.0", features = ["use-jemalloc"] }
surfman = "0.14.0"
glow = "0.17"
gl = "0.14"
gleam = "0.15"
ash = "0.38"
gl_generator = "0.14"

#= Slint
slint = { version = "1.18", default-features = false, features = [
  "backend-winit-wayland",
  "compat-1-2",
  "image-default-formats",
  "renderer-skia",
  "unstable-wgpu-30",
] }
slint-build = "1.18"

#= Utilities
anyhow = "1.0"
directories = "6.0"
dirs = "5.0"
euclid = "0.22"
image = { version = "0.25", default-features = false, features = [
  "gif",
  "jpeg",
  "png",
  "webp",
] }
log = "0.4"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
smol = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
url = "2"
winit = "0.30"

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
# Slint 1.18's `i-slint-compiler` specifies `icu_properties = "2.2.0"`, which
# conflicts with Servo 0.7's `mozjs_sys` (`icu_capi = "=2.1.2"` -> `icu_* ~2.1.1`).
# Relaxing `icu_properties` to `"2.1"` allows Cargo to unify `icu_*` on 2.1.x
# across Slint and Servo cleanly.
i-slint-compiler = { path = "patches/i-slint-compiler" }

