[package]
name = "nitium-android"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nitium-android-shell = { workspace = true }
nitium-webview = { workspace = true }

[features]
default = ["renderer-femtovg"]
renderer-femtovg = ["i-slint-backend-android-activity/renderer-femtovg"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
slint = { workspace = true, features = [
  "backend-android-activity-06",
  "compat-1-2",
  "unstable-fontique-011",
] }
i-slint-backend-android-activity = { workspace = true }

