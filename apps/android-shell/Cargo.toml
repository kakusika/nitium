[package]
name = "nitium-android-shell"
description = "Android Slint UI shell for Nitium"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
nitium-core = { workspace = true }
nitium-settings = { workspace = true }
nitium-shell = { workspace = true }
origiri = { workspace = true }
origiri-theme = { workspace = true }

#= Crates.io
slint = { workspace = true }
log = { workspace = true }

[build-dependencies]
origiri-build = { workspace = true }
slint-build = { workspace = true, features = ["experimental-module-builds"] }
